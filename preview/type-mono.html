<!DOCTYPE html>
<html lang="pt-br"><head><meta charset="utf-8"><title>Type — Mono &amp; Eyebrow</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;font-family:var(--font-sans);color:var(--fg1)}
  .wrap{padding:18px;display:flex;flex-direction:column;gap:10px}
  .meta{font-family:var(--font-mono);font-size:10px;color:var(--fg3)}
  .eyrow{display:flex;align-items:center;gap:10px}
</style></head><body class="vp">
<div class="wrap">
  <div class="meta">Eyebrow · Inter · 11/800 · tracking .18em · uppercase</div>
  <div class="eyrow"><span class="vp-rule"></span><span class="vp-eyebrow">Catálogo · Escada rolante</span></div>

  <div class="meta" style="margin-top:6px">Mono · JetBrains Mono · 12/400 · used for SKUs &amp; codes</div>
  <div style="display:flex;gap:10px;align-items:center">
    <span class="vp-meta">SKU&nbsp;VP-ESC-9821-A</span>
    <span class="vp-meta">24V&nbsp;DC</span>
    <span class="vp-meta">início&nbsp;<span style="color:#F5C400">/</span>&nbsp;corrimão</span>
  </div>

  <div class="meta" style="margin-top:6px">Wordmark · Display 900 · "PARTS" in yellow</div>
  <span class="vp-wordmark" style="font-size:28px"><span>VERTICAL</span><span class="vp-parts">PARTS</span></span>
</div>
</body></html>
