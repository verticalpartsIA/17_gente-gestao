<!DOCTYPE html>
<html lang="pt-br"><head><meta charset="utf-8"><title>Iconography — Lucide</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;font-family:var(--font-sans);color:var(--fg1)}
  .wrap{padding:18px;display:flex;flex-direction:column;gap:14px}
  .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .ico{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:80px}
  svg{stroke:#000;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--fg3)}
  .meta{font-family:var(--font-mono);font-size:10px;color:var(--fg3)}
  .arrow{font-family:var(--font-display);font-weight:900;font-size:24px;color:#F5C400}
</style></head><body class="vp">
<div class="wrap">
  <div class="meta">Lucide · 1.5px stroke · 24px · color = currentColor</div>
  <div class="row">
    <div class="ico"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M3 21h18M5 21V9l7-6 7 6v12M9 9h6M9 13h6M9 17h6"/></svg><span class="lbl">Building</span></div>
    <div class="ico"><svg width="28" height="28" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg><span class="lbl">Clock</span></div>
    <div class="ico"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M3 9h18M5 9V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v4M5 21V9M19 21V9M3 21h18"/></svg><span class="lbl">Package</span></div>
    <div class="ico"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96L12 12l8.73-5.04M12 22.08V12"/></svg><span class="lbl">Cube</span></div>
    <div class="ico"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg><span class="lbl">Arrow</span></div>
    <div class="ico"><svg width="28" height="28" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg><span class="lbl">Check</span></div>
    <div class="ico"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M22 16.92V19a2 2 0 0 1-2.18 2 19.86 19.86 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.86 19.86 0 0 1-3.07-8.67A2 2 0 0 1 4.11 1h2.08a2 2 0 0 1 2 1.72c.13.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L7.09 8.91a16 16 0 0 0 6 6l1.27-1.37a2 2 0 0 1 2.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0 1 22 16.92z"/></svg><span class="lbl">Phone</span></div>
  </div>
  <div class="row" style="gap:24px;align-items:baseline">
    <span class="meta">Allowed glyphs (text, not icons)</span>
    <span class="arrow">→</span>
    <span class="vp-meta">início · catálogo</span>
    <span style="font-size:18px">•</span>
  </div>
</div>
</body></html>
