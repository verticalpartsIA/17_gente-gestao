name: Deploy — gentegestao.vpsistema.com

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_APP_NAME: "VP Gente & Gestão"
          VITE_APP_SHORT_NAME: "VP RH"
          VITE_APP_ENV: production
          VITE_APP_VERSION: "1.0.0"
          VITE_APP_URL: https://gentegestao.vpsistema.com
          VITE_PLATFORM_NAME: "VP Sistema"
          VITE_PLATFORM_URL: https://vpsistema.com
          VITE_SUPPORT_EMAIL: suporte@vpsistema.com
          VITE_HR_EMAIL: rh@verticalparts.com.br
          VITE_DEFAULT_LOCALE: pt-BR
          VITE_DEFAULT_TIMEZONE: America/Sao_Paulo
          VITE_DEFAULT_CURRENCY: BRL
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: https://ubdkoqxfwcraftesgmbw.supabase.co/functions/v1
          VITE_SUPABASE_AVATARS_BUCKET: avatars
          VITE_SUPABASE_DOCUMENTS_BUCKET: employee-documents
          VITE_FEATURE_RH: "true"
          VITE_FEATURE_PONTO: "true"
          VITE_FEATURE_HOLERITE: "true"
          VITE_FEATURE_SST: "true"
          VITE_FEATURE_FROTA: "true"
          VITE_FEATURE_OMIE: "false"
          VITE_FEATURE_WHATSAPP: "false"
          VITE_FEATURE_N8N: "false"
          VITE_FEATURE_AI: "false"
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
